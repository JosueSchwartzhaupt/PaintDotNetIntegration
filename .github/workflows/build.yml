name: Build & Auto-Release Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Plugin
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build IntelliJ Plugin
        run: ./gradlew buildPlugin

      - name: Upload Build Artifact to Run Summary
        uses: actions/upload-artifact@v5
        with:
          name: PaintDotNetIntegration-Plugin
          path: build/distributions/*.zip

      - name: Create Git Tag & Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Paint.NET Integration v1.0.${{ github.run_number }}
          body: |
            ## 🎨 Paint.NET Integration Release

            Automated build release for commit `${{ github.sha }}`.

            ### 📥 Installation Instructions:
            1. Download `PaintDotNetIntegration-1.0.0.zip` from Assets below.
            2. Open IntelliJ IDEA → **Settings → Plugins → ⚙️ → Install Plugin from Disk...**.
            3. Select `PaintDotNetIntegration-1.0.0.zip` and restart IntelliJ.
          files: build/distributions/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
