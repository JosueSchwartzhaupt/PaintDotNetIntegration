name: Build & Release Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    name: Build Plugin Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build IntelliJ Plugin
        run: ./gradlew buildPlugin

      - name: Upload Plugin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintDotNetIntegration-Plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    name: Attach Artifact to GitHub Release
    needs: build
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Built Plugin Artifact
        uses: actions/download-artifact@v4
        with:
          name: PaintDotNetIntegration-Plugin
          path: plugin-dist

      - name: Upload Zip to Release
        uses: secrets/GITHUB_TOKEN && actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./plugin-dist/*.zip
          asset_name: PaintDotNetIntegration.zip
          asset_content_type: application/zip
